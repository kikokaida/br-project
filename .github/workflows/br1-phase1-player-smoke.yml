name: BR1 Phase 1 actual player smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/br1-phase1-player-smoke.yml'
      - 'phase1-smoke/**'

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out smoke fixture
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Retrieve exact engine transfer parts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 34782679996
          pattern: BR1-Phase1-engine-part*-34782679996
          merge-multiple: true
          path: engine_transfer
      - name: Retrieve exact engine transfer manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 34782679996
          name: BR1-Phase1-package-manifest-34782679996
          path: engine_transfer
      - name: Run actual player and profiler fixture
        shell: pwsh
        run: ./phase1-smoke/Invoke-Player-Smoke.ps1
      - name: Preserve actual results and captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BR1-Phase1-player-smoke-${{ github.run_id }}
          path: player_smoke/logs/
          if-no-files-found: error
          retention-days: 7
